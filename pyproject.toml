[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdarpan"
version = "0.1.0"
description = "Enterprise cryptographic discovery, CBOM generation and quantum risk analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Team Q-DARPAN" }]
keywords = ["cbom", "cyclonedx", "post-quantum", "cryptography", "sbom", "pqc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # 0.26.0 corrupts the interpreter heap on Windows/CPython 3.10: after a
    # handful of collector runs in one process, unrelated os.stat calls start
    # raising "TypeError: an integer is required" or dying with an access
    # violation. Bisected to the tree-sitter version alone -- 0.25.2 is clean
    # under the identical workload. Do not widen this bound without re-running
    # tests/test_api.py, which is what surfaced it.
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-java",
    "tree-sitter-go",
    "pyelftools>=0.31",
    "cyclonedx-python-lib>=11,<12",
    "cryptography>=43",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4"]

[project.scripts]
qdarpan = "qdarpan.cli:main"

[project.urls]
Homepage = "https://github.com/RohanExploit/q-darpan"

[tool.setuptools.packages.find]
include = ["qdarpan*"]

[tool.setuptools.package-data]
qdarpan = ["policy/*.json", "collectors/rules/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
